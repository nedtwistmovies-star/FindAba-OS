<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FindAba by SANDALSroyalle | City OS</title>
    <meta name="description" content="The industrial-grade city platform for Enyimba City." />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      :root { --aba-green: #008c52; --aba-gold: #FFD700; --aba-deep: #002113; --aba-red: #FF4444; }
      #root { min-height: 100dvh; }
      
      /* AGGRESSIVE OVERLAY REMOVAL */
      vercel-live-feedback,
      #vercel-live-feedback-container,
      .vercel-toolbar,
      [id^="vercel-live-feedback"],
      [class*="vercel-toolbar"],
      #vercel-toolbar,
      [data-vercel-toolbar] {
        display: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
        opacity: 0 !important;
        width: 0 !important;
        height: 0 !important;
        position: fixed !important;
        top: -9999px !important;
        left: -9999px !important;
        z-index: -9999 !important;
      }
    </style>
    <script>
      // CLEANUP STALE SERVICE WORKERS IN PREVIEW
      if ('serviceWorker' in navigator && window.location.hostname.includes('run.app')) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
      }

      // FORCE ENABLE CONTEXT MENU & ENSURE TOUCH SCROLLING
      window.oncontextmenu = null;
      document.oncontextmenu = null;
      window.addEventListener('contextmenu', (e) => {
        // Explicitly allow right-click to function
        return true;
      }, { capture: true });

      // Ensure touch scrolling is not blocked
      document.addEventListener('touchstart', function() {}, {passive: true});
      document.addEventListener('touchmove', function() {}, {passive: true});

      // PERMANENTLY REMOVE VERCEL TOOLBAR / OVERLAYS
      const hideOverlays = () => {
        const selectors = [
          'vercel-live-feedback',
          '#vercel-live-feedback-container',
          '.vercel-toolbar',
          '[id^="vercel-live-feedback"]',
          '[class*="vercel-toolbar"]',
          '#vercel-toolbar',
          '[data-vercel-toolbar]',
          '[data-vercel-live-feedback]'
        ];
        selectors.forEach(s => {
          const els = document.querySelectorAll(s);
          els.forEach(el => {
            (el as HTMLElement).style.setProperty('display', 'none', 'important');
            (el as HTMLElement).style.setProperty('visibility', 'hidden', 'important');
            (el as HTMLElement).style.setProperty('opacity', '0', 'important');
            (el as HTMLElement).style.setProperty('pointer-events', 'none', 'important');
            (el as HTMLElement).style.setProperty('z-index', '-9999', 'important');
            el.remove();
          });
        });

        // Aggressive text-based removal for "Launch!" pill
        const walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
        let node;
        const nodesToRemove: Node[] = [];
        while(node = walk.nextNode()) {
          if (node.textContent && (node.textContent.includes('Launch!') || node.textContent.includes('Vercel'))) {
            nodesToRemove.push(node);
          }
        }
        nodesToRemove.forEach(n => {
          let parent = n.parentElement;
          while (parent && parent !== document.body) {
            if (parent.tagName === 'BUTTON' || parent.classList.contains('vercel-toolbar') || parent.getAttribute('id')?.includes('vercel') || parent.hasAttribute('data-vercel-toolbar')) {
              parent.remove();
              break;
            }
            parent = parent.parentElement;
          }
        });

        try { window.localStorage.setItem('vercel_toolbar_hidden', '1'); } catch(e) {}
      };
      
      // Run immediately
      hideOverlays();
      
      // Watch for new elements
      const observer = new MutationObserver((mutations) => {
        hideOverlays();
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });

      // Block Vercel script injection and any script that looks like a toolbar
      const originalCreateElement = document.createElement;
      document.createElement = function(tagName: string, options?: ElementCreationOptions) {
        const element = originalCreateElement.call(document, tagName, options);
        if (tagName.toLowerCase() === 'script') {
          const scriptObserver = new MutationObserver(() => {
            const src = (element as HTMLScriptElement).src;
            const id = (element as HTMLElement).id;
            const data = (element as HTMLElement).getAttribute('data-vercel-toolbar');
            if (src.includes('vercel') || src.includes('toolbar') || id.includes('vercel') || data !== null) {
              console.log('[Security] Blocked Vercel/Toolbar script:', src || id || 'data-attr');
              (element as HTMLScriptElement).src = '';
              element.remove();
            }
          });
          scriptObserver.observe(element, { attributes: true, attributeFilter: ['src', 'id', 'data-vercel-toolbar'] });
        }
        return element;
      } as any;
    </script>
</head>
<body>
    <div id="root"></div>
    <script src="https://js.paystack.co/v1/inline.js" defer></script>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
