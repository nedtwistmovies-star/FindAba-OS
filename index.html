<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FindAba by SANDALSroyalle | City OS</title>
    <meta name="description" content="The industrial-grade city platform for Enyimba City." />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      :root { --aba-green: #008c52; --aba-gold: #FFD700; --aba-deep: #002113; --aba-red: #FF4444; }
      #root { min-height: 100dvh; }
      
      /* AGGRESSIVE OVERLAY REMOVAL */
      vercel-live-feedback,
      #vercel-live-feedback-container,
      .vercel-toolbar,
      [id^="vercel-live-feedback"],
      [class*="vercel-toolbar"],
      #vercel-toolbar,
      [data-vercel-toolbar] {
        display: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
        opacity: 0 !important;
        width: 0 !important;
        height: 0 !important;
        position: fixed !important;
        top: -9999px !important;
        left: -9999px !important;
        z-index: -9999 !important;
      }
    </style>
    <script>
      // CLEANUP STALE SERVICE WORKERS IN PREVIEW
      if ('serviceWorker' in navigator && window.location.hostname.includes('run.app')) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
      }

      // FORCE ENABLE CONTEXT MENU & ENSURE ALL CLICKS WORK
      const ensureInteractions = () => {
        window.oncontextmenu = null;
        document.oncontextmenu = null;
        document.body.oncontextmenu = null;
        
        // Explicitly allow context menu on right click
        window.addEventListener('contextmenu', (e) => {
          e.stopPropagation();
          return true;
        }, { capture: true });

        // Ensure mouse events are not blocked
        window.addEventListener('mousedown', (e) => {
          if (e.button === 2) { // Right click
            e.stopPropagation();
          }
        }, { capture: true, passive: true });
      };

      ensureInteractions();

      // Ensure touch scrolling is not blocked
      document.addEventListener('touchstart', function() {}, {passive: true});
      document.addEventListener('touchmove', function() {}, {passive: true});

      // PERMANENTLY REMOVE VERCEL TOOLBAR / OVERLAYS
      const hideOverlays = () => {
        const selectors = [
          'vercel-live-feedback',
          '#vercel-live-feedback-container',
          '.vercel-toolbar',
          '[id^="vercel-live-feedback"]',
          '[class*="vercel-toolbar"]',
          '#vercel-toolbar',
          '[data-vercel-toolbar]',
          '[data-vercel-live-feedback]',
          '#vercel-toolbar-container',
          '.vercel-toolbar-container'
        ];
        
        selectors.forEach(s => {
          try {
            const els = document.querySelectorAll(s);
            els.forEach(el => {
              el.remove();
            });
          } catch(e) {}
        });

        // Hide anything that contains "Vercel" or "Launch!" text and looks like a platform pill
        const elements = document.getElementsByTagName('*');
        for (let i = 0; i < elements.length; i++) {
          const el = elements[i] as HTMLElement;
          if (el.innerText && (el.innerText.includes('Launch!') || el.innerText.includes('Vercel'))) {
             // If it's a small floating button/pill
             const rect = el.getBoundingClientRect();
             if (rect && rect.width < 150 && rect.height < 150) {
                el.style.display = 'none';
                el.style.opacity = '0';
                el.style.pointerEvents = 'none';
             }
          }
        }

        try { window.localStorage.setItem('vercel_toolbar_hidden', '1'); } catch(e) {}
      };
      
      // Run immediately
      hideOverlays();
      
      // Watch for new elements
      const observer = new MutationObserver((mutations) => {
        hideOverlays();
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });
    </script>
</head>
<body>
    <div id="root"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://js.paystack.co/v1/inline.js" defer></script>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
