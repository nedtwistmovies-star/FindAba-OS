<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FindAba by SANDALSroyalle | City OS</title>
    <meta name="description" content="The industrial-grade city platform for Enyimba City." />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      :root { --aba-green: #008c52; --aba-gold: #FFD700; --aba-deep: #002113; --aba-red: #FF4444; }
      #root { min-height: 100dvh; }
      
      /* AGGRESSIVE OVERLAY REMOVAL */
      vercel-live-feedback,
      #vercel-live-feedback-container,
      .vercel-toolbar,
      [id^="vercel-live-feedback"],
      [class*="vercel-toolbar"],
      #vercel-toolbar,
      [data-vercel-toolbar] {
        display: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
        opacity: 0 !important;
        width: 0 !important;
        height: 0 !important;
        position: fixed !important;
        top: -9999px !important;
        left: -9999px !important;
        z-index: -9999 !important;
      }
    </style>
    <script>
      // GLOBAL DIAGNOSTIC RUNTIME ERROR TRACKER
      (function() {
        var logs = [];
        window.addEventListener('error', function(e) {
          showErrorOverlay('Unhandled Runtime Error: ' + e.message, e.filename, e.lineno, e.colno, e.error);
        });
        window.addEventListener('unhandledrejection', function(e) {
          var err = e.reason;
          var msg = err ? (err.message || String(err)) : 'Unknown promise rejection';
          showErrorOverlay('Unhandled Promise Rejection: ' + msg, '', 0, 0, err);
        });

        // Capture console messages for easier remote diagnosis
        var _log = console.log;
        var _warn = console.warn;
        var _error = console.error;
        console.log = function() {
          _log.apply(console, arguments);
          log('INFO', Array.from(arguments).join(' '));
        };
        console.warn = function() {
          _warn.apply(console, arguments);
          log('WARN', Array.from(arguments).join(' '));
        };
        console.error = function() {
          _error.apply(console, arguments);
          log('ERROR', Array.from(arguments).join(' '));
        };

        function log(lvl, msg) {
          logs.push('[' + lvl + '] ' + msg);
          if (logs.length > 100) logs.shift();
        }

        function showErrorOverlay(message, source, lineno, colno, error) {
          var errDiv = document.getElementById('debug-error-overlay');
          if (!errDiv) {
            errDiv = document.createElement('div');
            errDiv.id = 'debug-error-overlay';
            errDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#0d0606;color:#fca5a5;padding:32px;font-family:monospace;white-space:pre-wrap;z-index:999999;overflow-y:auto;font-size:13px;line-height:1.6;border:5px solid #ef4444;box-sizing:border-box;';
            document.documentElement.appendChild(errDiv);
          }
          
          var stack = error && error.stack ? error.stack : 'No stack trace available';
          var escMsg = esc(message);
          var escSource = esc(source || 'Unknown file');
          var escStack = esc(stack);
          var escLogs = esc(logs.join('\n'));

          errDiv.innerHTML = '<h2 style="color:#ef4444;margin-top:0;font-size:20px;border-bottom:1px solid rgba(239,68,68,0.3);padding-bottom:12px;">🚨 Client Runtime Exception</h2>' +
            '<p style="margin:16px 0;"><b>message:</b> <span style="background:rgba(239,68,68,0.1);padding:2px 6px;border-radius:4px;color:#f87171;">' + escMsg + '</span></p>' +
            '<p style="margin:16px 0;"><b>source:</b> ' + escSource + ' (Line ' + lineno + ', Col ' + colno + ')</p>' +
            '<p style="margin:16px 0;font-weight:bold;color:#fca5a5;">Stack Trace:</p>' +
            '<pre style="background:rgba(255,255,255,0.05);padding:16px;border-radius:8px;overflow-x:auto;border:1px solid rgba(255,255,255,0.1);">' + escStack + '</pre>' +
            '<p style="margin:24px 0 8px 0;font-weight:bold;color:#fca5a5;">Console Boot Stream Trace:</p>' +
            '<pre style="background:rgba(0,0,0,0.3);padding:16px;border-radius:8px;overflow-x:auto;border:1px solid rgba(255,255,255,0.05);color:#e2e8f0;max-height:200px;overflow-y:auto;">' + (escLogs || 'No logs captured before crash') + '</pre>' +
            '<div style="margin-top:32px;text-align:right;"><button onclick="window.location.reload(true)" style="background:#ef4444;color:white;border:none;padding:8px 24px;border-radius:6px;font-weight:bold;cursor:pointer;">FORCE REFRESH</button></div>';
        }

        function esc(str) {
          if (!str) return '';
          return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
      })();

      // CLEANUP STALE SERVICE WORKERS IN PREVIEW
      if ('serviceWorker' in navigator && window.location.hostname.includes('run.app')) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
      }

      // FORCE ENABLE CONTEXT MENU & ENSURE ALL CLICKS WORK
      const ensureInteractions = () => {
        try {
          if (typeof window !== 'undefined' && window !== null) {
            window.oncontextmenu = null;
          }
          if (typeof document !== 'undefined' && document !== null) {
            document.oncontextmenu = null;
            // ONLY access body if it's available. In <head>, it won't be yet.
            if (document.body) {
              try {
                document.body.oncontextmenu = null;
              } catch (innerErr) {
                // Ignore restricted property errors
              }
            } else {
              // Register to run once body is available
              document.addEventListener('DOMContentLoaded', () => {
                if (document.body) {
                  try { document.body.oncontextmenu = null; } catch (e) {}
                }
              });
            }
          }
        } catch (err) {
          console.warn("[Registry OS] Interaction handshake failed but suppressed.");
        }
        
        // Explicitly allow context menu on right click
        try {
          if (typeof window !== 'undefined') {
            window.addEventListener('contextmenu', (e) => {
              if (e && e.stopPropagation) e.stopPropagation();
              return true;
            }, { capture: true });

            // Ensure mouse events are not blocked
            window.addEventListener('mousedown', (e) => {
              if (e && e.button === 2 && e.stopPropagation) { // Right click
                e.stopPropagation();
              }
            }, { capture: true, passive: true });
          }
        } catch (eventErr) {
          // Event listener binding failed
        }
      };

      ensureInteractions();

      // Ensure touch scrolling is not blocked
      document.addEventListener('touchstart', function() {}, {passive: true});
      document.addEventListener('touchmove', function() {}, {passive: true});

      try { window.localStorage.setItem('vercel_toolbar_hidden', '1'); } catch(e) {}
    </script>
</head>
<body>
    <div id="root"></div>
    <script src="https://js.paystack.co/v1/inline.js" defer></script>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
